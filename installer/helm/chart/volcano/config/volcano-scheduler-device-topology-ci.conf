actions: "enqueue, allocate, backfill"
tiers:
- plugins:
  - name: priority
  - name: gang
    enablePreemptable: false
  - name: conformance
- plugins:
  - name: drf
    enablePreemptable: false
  - name: predicates
  - name: proportion
  - name: nodeorder
  - name: device-topology-aware
deviceTopology:
  providers:
  - id: e2e-node-annotation
    type: annotation
    identityNamespace: e2e-gpu-v1
    resources:
    - nvidia.com/gpu
  adapters:
  - type: mock
    provider: e2e-node-annotation
    resource: nvidia.com/gpu
